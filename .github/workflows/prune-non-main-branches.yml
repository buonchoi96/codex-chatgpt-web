name: Prune non-main branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/prune-non-main-branches.yml

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Delete every remote branch except main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          while IFS= read -r branch; do
            if [[ "$branch" == "main" || "$branch" == "HEAD" || -z "$branch" ]]; then
              continue
            fi
            echo "Deleting branch: $branch"
            git push origin --delete "$branch"
          done < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | sort -u)
