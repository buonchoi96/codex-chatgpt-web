name: Connector Selection Regression
on:
  push:
    branches: [main]
    paths:
      - "src/adapters/chatgpt-web/browser-worker.ts"
      - "tests/browser-worker-contract.test.ts"
      - ".github/workflows/connector-selection.yml"
  workflow_dispatch:
jobs:
  connector-selection:
    name: Connector selection (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install pinned dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Connector routing and selection tests
        run: bun test --timeout 15000 ./tests/browser-worker-contract.test.ts ./tests/connector-routing.test.ts
