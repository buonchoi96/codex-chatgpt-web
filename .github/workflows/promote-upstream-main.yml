name: Promote upstream 6.1.8 release after green CI
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
permissions:
  contents: write
  actions: write
jobs:
  promote:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Preserve previous releases as prereleases and dispatch official v6.1.8
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')"
          if [[ "$current_sha" != "$VERIFIED_SHA" ]]; then
            echo "::notice::Main moved since green CI; do not release stale sources"
            exit 0
          fi
          tag="v6.1.8"
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "::notice::Official release already exists; leaving published release untouched"
            exit 0
          fi
          # Preserve every previous release, tag and asset; alter only GitHub Release's pre-release flag.
          mapfile -t previous_tags < <(gh release list --repo "$GH_REPO" --limit 100 --json tagName --jq '.[].tagName')
          for previous in "${previous_tags[@]}"; do
            [[ "$previous" == "$tag" ]] && continue
            echo "Mark previous release as prerelease: $previous"
            gh release edit "$previous" --repo "$GH_REPO" --prerelease --latest=false
          done
          existing_tag_sha="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null || true)"
          if [[ -n "$existing_tag_sha" ]]; then
            if [[ "$existing_tag_sha" != "$VERIFIED_SHA" ]]; then
              echo "::error::Tag $tag points to unexpected revision $existing_tag_sha"
              exit 1
            fi
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$VERIFIED_SHA" >/dev/null
          fi
          # GITHUB_TOKEN-created git tags do not trigger push workflows.
          # Explicit workflow_dispatch on the exact immutable tag builds the real release.
          gh workflow run release.yml --repo "$GH_REPO" --ref "$tag"
