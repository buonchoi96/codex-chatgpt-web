name: Update Windows release from validated main build

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-windows-release.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download validated Windows artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "10657901399"
        run: |
          set -euo pipefail
          curl --fail --location             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"             --output windows-artifact.zip
          mkdir -p release-assets
          unzip -q windows-artifact.zip -d release-assets
          find release-assets -maxdepth 2 -type f -print
          test -n "$(find release-assets -maxdepth 2 -type f -name '*.exe' -print -quit)"
          (
            cd release-assets
            find . -maxdepth 2 -type f ! -name SHA256SUMS.txt -print0               | sort -z               | xargs -0 sha256sum > SHA256SUMS.txt
          )
          cat release-assets/SHA256SUMS.txt

      - name: Replace public Windows release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: "v5.0.8-custom-windows"
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -maxdepth 2 -type f -name '*.exe' -print | sort)
          assets+=("release-assets/SHA256SUMS.txt")
          cat > release-notes.md <<'EOF'
          ## Codex Web GPT v5.0.8 — Custom Windows build

          Latest validated Windows installer from the consolidated `main` branch.

          Included customizations:
          - Windows installer targeting `E:\Codex Web GPT\App`.
          - Launcher/runtime data under `E:\Codex Web GPT\Data`.
          - Fresh-conversation-per-turn support.
          - CDP/viewport recovery hardening.
          - Multi-task completion persistence with a mandatory Full Harness completion receipt.
          - Automatic same-turn continuation when ChatGPT attempts to finish before the receipt is accepted.
          - Automatic repair of the stale managed Codex Interrupt hook when **Install models** is run after reinstalling the app.
          - Broker tool-call/completion telemetry.

          Validation:
          - Source/regression verification passed.
          - Windows packaging passed.
          - E-drive installation smoke passed.
          - Packaged launcher smoke passed.

          Source commit: `e2c97150c65aaf7a6f27faf47932e8956337cee6`
          Build workflow: https://github.com/buonchoi96/codex-chatgpt-web/actions/runs/35639842198

          `SHA256SUMS.txt` contains the checksum for the published installer.
          EOF

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}"               --repo "$GITHUB_REPOSITORY"               --clobber
            gh release edit "$RELEASE_TAG"               --repo "$GITHUB_REPOSITORY"               --title "Codex Web GPT v5.0.8 Custom Windows"               --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" "${assets[@]}"               --repo "$GITHUB_REPOSITORY"               --target "e2c97150c65aaf7a6f27faf47932e8956337cee6"               --title "Codex Web GPT v5.0.8 Custom Windows"               --notes-file release-notes.md
          fi
