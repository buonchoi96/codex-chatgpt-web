name: Delete temporary integration branch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/delete-temp-integration-branch.yml

permissions:
  contents: write

jobs:
  delete-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Delete temporary branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete fix/native-completion-and-install-models-recovery
