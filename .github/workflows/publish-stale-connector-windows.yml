name: Publish stale-connector recovery Windows release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-stale-connector-windows.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download validated Windows build from main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "10660449388"
        run: |
          set -euo pipefail
          curl --fail --location             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"             --output windows-artifact.zip
          mkdir -p release-assets
          unzip -q windows-artifact.zip -d release-assets
          installer="$(find release-assets -maxdepth 2 -type f -name '*.exe' -print -quit)"
          test -n "$installer"
          sha256sum "$installer" | sed 's#release-assets/##' > release-assets/SHA256SUMS.txt
          cat release-assets/SHA256SUMS.txt

      - name: Update public Windows release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: "v5.0.8-custom-windows"
          SOURCE_SHA: "414485bae007076a75e7705b367fa4018d9026aa"
        run: |
          set -euo pipefail
          installer="$(find release-assets -maxdepth 2 -type f -name '*.exe' -print -quit)"
          test -n "$installer"

          cat > release-notes.md <<'EOF'
          ## Codex Web GPT v5.0.8 — Custom Windows build

          Latest validated Windows installer built from the consolidated `main` branch.

          This release includes:
          - Windows installer targeting `E:\Codex Web GPT\App`.
          - Launcher/runtime data under `E:\Codex Web GPT\Data`.
          - Fresh-conversation-per-turn support.
          - CDP/viewport recovery hardening.
          - End-to-end multi-task completion persistence with mandatory Full Harness completion receipts.
          - Automatic recovery of stale managed Codex Interrupt hooks when **Install models** is run after reinstalling.
          - **Stale retained connector recovery**: retained ChatGPT conversations no longer blindly trust an old connector binding after a browser refresh/navigation.
          - The launcher invalidates stale connector proof on full main-frame navigation while preserving the retained conversation identity.
          - The browser worker verifies the actual selected connector pill; if it is missing, it automatically reselects `@codex` before attaching/sending the prompt.

          Validation for source commit `414485bae007076a75e7705b367fa4018d9026aa`:
          - Source/regression verification passed in the dedicated Windows build.
          - Windows packaging passed.
          - E-drive installation smoke passed.
          - Packaged launcher smoke passed.

          Build workflow:
          https://github.com/buonchoi96/codex-chatgpt-web/actions/runs/35646518291

          `SHA256SUMS.txt` contains the checksum for the published installer.
          EOF

          gh release upload "$RELEASE_TAG"             "$installer" release-assets/SHA256SUMS.txt             --repo "$GITHUB_REPOSITORY"             --clobber

          gh release edit "$RELEASE_TAG"             --repo "$GITHUB_REPOSITORY"             --target "$SOURCE_SHA"             --title "Codex Web GPT v5.0.8 Custom Windows"             --notes-file release-notes.md
