name: Publish main Windows installer

on:
  workflow_run:
    workflows: ["Build v5.0.8 Fresh E Drive Windows"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-main-windows
  # Fixed-name release assets are replaced serially so two completed builds cannot race.
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}

    steps:
      - name: Check whether this build is still current main
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$SOURCE_SHA" == "$current_main" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Validated build is current main: $SOURCE_SHA"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale validated build $SOURCE_SHA; current main is $current_main"
          fi

      - name: Check out the exact validated commit
        if: steps.gate.outputs.publish == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download validated Windows installer
        if: steps.gate.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: windows-installer-main-${{ github.event.workflow_run.head_sha }}
          path: upstream-artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Prepare release assets
        if: steps.gate.outputs.publish == 'true'
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t installers < <(find upstream-artifact -maxdepth 1 -type f -name '*-win-x64.exe' -print)
          if [[ "${#installers[@]}" -ne 1 ]]; then
            echo "Expected exactly one Windows installer; found ${#installers[@]}" >&2
            find upstream-artifact -maxdepth 2 -type f -print >&2 || true
            exit 1
          fi

          mkdir -p release-assets
          installer="${installers[0]}"
          installer_name="$(basename "$installer")"
          cp "$installer" "release-assets/$installer_name"
          sha256sum "release-assets/$installer_name" | sed 's#  release-assets/#  #' > release-assets/SHA256SUMS.txt

          version="$(jq -r '.version' package.json)"
          test -n "$version"
          test "$version" != "null"

          echo "installer=$installer_name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cat release-assets/SHA256SUMS.txt

      - name: Publish custom Windows release
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.assets.outputs.version }}-custom-windows
        run: |
          set -euo pipefail
          installer="release-assets/${{ steps.assets.outputs.installer }}"
          test -f "$installer"
          test -f release-assets/SHA256SUMS.txt

          cat > release-notes.md <<EOF
          ## Codex Web GPT v${{ steps.assets.outputs.version }} — Custom Windows build

          Built and validated from main commit '${SOURCE_SHA}' by workflow run '${SOURCE_RUN_ID}'.

          Validation completed before this publish job:
          - 'bun run verify'
          - Windows packaging
          - 'bun run app:smoke'
          - AVX2-independent Bun 1.4.0 runtime preparation

          Installer:
          - '${{ steps.assets.outputs.installer }}'
          - 'SHA256SUMS.txt' contains its SHA-256 checksum.

          The publish stage reuses the already validated Actions artifact and does not rebuild the installer.
          EOF

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.id')"

            delete_asset_by_name() {
              local name="$1"
              local attempt asset_id still_present

              for attempt in 1 2 3 4 5; do
                asset_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100"                   --jq ".[] | select(.name == \"$name\") | .id" | head -n 1)"

                if [[ -z "$asset_id" ]]; then
                  return 0
                fi

                if gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"; then
                  for _ in 1 2 3 4 5; do
                    still_present="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100"                       --jq ".[] | select(.name == \"$name\") | .id" | head -n 1)"
                    if [[ -z "$still_present" ]]; then
                      return 0
                    fi
                    sleep 1
                  done
                fi

                echo "Retrying release asset deletion for $name (attempt $attempt/5)" >&2
                sleep $((attempt * 2))
              done

              echo "Could not remove existing release asset: $name" >&2
              return 1
            }

            delete_asset_by_name "$(basename "$installer")"
            delete_asset_by_name "SHA256SUMS.txt"

            gh release upload "$RELEASE_TAG"               "$installer" release-assets/SHA256SUMS.txt               --repo "$GITHUB_REPOSITORY"

            gh release edit "$RELEASE_TAG"               --repo "$GITHUB_REPOSITORY"               --target "$SOURCE_SHA"               --title "Codex Web GPT v${{ steps.assets.outputs.version }} Custom Windows"               --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG"               "$installer" release-assets/SHA256SUMS.txt               --repo "$GITHUB_REPOSITORY"               --target "$SOURCE_SHA"               --title "Codex Web GPT v${{ steps.assets.outputs.version }} Custom Windows"               --notes-file release-notes.md
          fi
