name: Cleanup temporary merge refs once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-merge-refs-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: "startsWith(github.event.head_commit.message, 'chore: cleanup temporary merge refs')"
    runs-on: ubuntu-latest
    steps:
      - name: Delete superseded merge and ops refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            "ops/merge-upstream-v6.1.6-20261008" \
            "merge/upstream-v6.1.6-candidate"
          do
            ref="repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
              echo "Deleting ${branch}"
              gh api --method DELETE "${ref}"
            else
              echo "Already absent: ${branch}"
            fi
          done
