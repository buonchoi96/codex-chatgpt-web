name: Cleanup migrated temporary branches
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
permissions:
  contents: write
jobs:
  cleanup:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete only archived or fully migrated temporary branch refs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$main_sha" != "$VERIFIED_SHA" ]]; then
            echo "::notice::A later commit moved main; waiting for its own successful CI"
            exit 0
          fi
          archive_sha="$(gh api "repos/$REPO/git/ref/heads/archive/custom-main-pre-upstream-2026-10-11" --jq '.object.sha')"
          [[ "$archive_sha" == "9cbe7aec2ee9121c1b6f5316fa7103c5a2849367" ]] || {
            echo "::error::Legacy archive changed; refusing branch cleanup"; exit 1;
          }
          release_pre="$(gh api "repos/$REPO/releases/tags/v6.1.8" --jq '.prerelease')"
          [[ "$release_pre" == "false" ]] || {
            echo "::error::Official v6.1.8 release not verified"; exit 1;
          }
          # Both test branch tip commits are independently retained by immutable prerelease tags.
          for item in \
            'test/986k-context-archive|1561b6dce2cda8f913454d656cc1f748b352e693|v6.1.2-986k-context-archive-pre.9' \
            'test/986k-enhanced-cherrypicks|e6c68eb99e02260d439bfc2d1b9f0c67fc163b77|v6.1.2-986k-enhanced-cherrypicks-pre.9'; do
            IFS='|' read -r branch expected tag <<< "$item"
            tag_sha="$(gh api "repos/$REPO/git/ref/tags/$tag" --jq '.object.sha')"
            [[ "$tag_sha" == "$expected" ]] || {
              echo "::error::The release tag $tag has changed; refusing cleanup"; exit 1;
            }
          done
          for item in \
            'migration/upstream-6.1.8-plus-selected-features|7efd6ea147ff6f3c06c65f01428cf64dd4f5a3f7' \
            'test/986k-context-archive|1561b6dce2cda8f913454d656cc1f748b352e693' \
            'test/986k-enhanced-cherrypicks|e6c68eb99e02260d439bfc2d1b9f0c67fc163b77'; do
            IFS='|' read -r branch expected <<< "$item"
            ref="repos/$REPO/git/ref/heads/$branch"
            found="$(gh api "$ref" --jq '.object.sha' 2>/dev/null || true)"
            if [[ -z "$found" ]]; then
              echo "Already absent: $branch"
              continue
            fi
            [[ "$found" == "$expected" ]] || {
              echo "::error::The branch $branch changed since review; refusing delete"; exit 1;
            }
            gh api -X DELETE "repos/$REPO/git/refs/heads/$branch"
            echo "Deleted temporary branch: $branch"
            echo "- \`$branch\` deleted; SHA \`$expected\` retained by archive/release history" >> "$GITHUB_STEP_SUMMARY"
          done
