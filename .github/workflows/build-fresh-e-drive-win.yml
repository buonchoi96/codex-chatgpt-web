name: Build v5.0.8 Fresh E Drive Windows

on:
  push:
    branches:
      - main
      - custom/v5.0.8-fresh-e-drive
      - fix/v5.0.8-e-drive-viewport-recovery
      - fix/v5.0.8-multitask-completion-persistence
      - fix/native-completion-and-install-models-recovery
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: build-fresh-e-drive-win-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cancel-stale-main-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale main workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != "push" || "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Stale-run cleanup is only needed for pushes to main."
            exit 0
          fi

          runs_json="${RUNNER_TEMP}/main-runs.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&per_page=100" > "${runs_json}"

          mapfile -t stale_ids < <(
            jq -r               --arg sha "${GITHUB_SHA}"               --argjson current_run "${GITHUB_RUN_ID}"               '.workflow_runs[]
               | select(.id != $current_run)
               | select(.head_sha != $sha)
               | select(.status == "queued"
                        or .status == "in_progress"
                        or .status == "waiting"
                        or .status == "requested"
                        or .status == "pending")
               | .id'               "${runs_json}"
          )

          if [[ "${#stale_ids[@]}" -eq 0 ]]; then
            echo "No stale main workflow runs need cancellation."
            exit 0
          fi

          for run_id in "${stale_ids[@]}"; do
            echo "Cancelling stale main workflow run ${run_id}"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null || {
              echo "Run ${run_id} could not be cancelled; it may have completed concurrently."
            }
          done

  build-windows:
    needs: cancel-stale-main-runs
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install launcher dependencies
        working-directory: launcher
        run: bun install --frozen-lockfile

      - name: Prepare AVX2-independent Windows runtime
        shell: pwsh
        run: ./scripts/prepare-windows-baseline-bun.ps1 -Version 1.4.0 -GitHubEnv $env:GITHUB_ENV

      - name: Verify source and regression tests
        run: bun run verify

      - name: Build Windows launcher
        run: bun run --cwd launcher package:win

      - name: Provide an E drive for installer smoke
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\codex-e-drive" | Out-Null
          subst E: "$env:RUNNER_TEMP\codex-e-drive"

      - name: Smoke packaged launcher
        run: bun run app:smoke

      - name: Remove temporary E drive
        if: always()
        shell: pwsh
        run: |
          subst E: /D 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host "E: subst was not active" }
          exit 0

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-main-${{ github.sha }}
          path: launcher/artifacts/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
